name: 🚀 CI Pipeline

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  GO_VERSION: '1.25.3'
  REGISTRY: ghcr.io

jobs:
  # === Fast Unit Tests (runs first) ===
  unit-tests:
    name: 🔬 Unit Tests
    runs-on: ubuntu-latest
    outputs:
      should-build-docker: ${{ steps.changes.outputs.docker == 'true' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🔍 Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.dockerignore'
            go:
              - 'api/**/*.go'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'frontend/**'

      - name: 🐹 Setup Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api/go.sum

      - name: 📁 Prepare frontend
        if: steps.changes.outputs.frontend == 'true'
        run: cp -r frontend api/

      - name: 🧪 Run Go tests
        if: steps.changes.outputs.go == 'true'
        working-directory: ./api
        run: |
          go mod tidy
          go test -v -race -coverprofile=coverage.out ./...

      - name: 🔍 Lint Go code
        if: steps.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ./api

      - name: 📈 Upload coverage
        if: steps.changes.outputs.go == 'true'
        uses: codecov/codecov-action@v4
        with:
          file: ./api/coverage.out

  # === Docker Build & Test (conditional) ===
  docker-test:
    name: 🐳 Docker Test
    runs-on: ubuntu-latest
    needs: unit-tests
    if: needs.unit-tests.outputs.should-build-docker == 'true' || github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            test: true
          - platform: linux/arm64
            test: false

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: ${{ matrix.test }}
          push: false
          tags: promptforge:test-${{ matrix.platform }}
          cache-from: type=gha,scope=test-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.platform }}

      - name: 🧪 Test container
        if: matrix.test
        run: |
          docker run -d --name test -p 8080:8080 promptforge:test-amd64
          sleep 10
          
          # Health check with timeout
          timeout 60 bash -c 'until curl -f http://localhost:8080/api/health; do sleep 2; done'
          
          # API tests
          curl -f http://localhost:8080/api/health
          curl -f http://localhost:8080/api/providers
          curl -f http://localhost:8080/ | grep -q "PromptForge"
          
          docker stop test

  # === Security Scan (only on push to main) ===
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: [unit-tests, docker-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: 🔍 Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd api
          ~/go/bin/govulncheck ./...

      - name: 🔍 Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # === Docker Build & Push (only on push) ===
  build-and-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, docker-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api/go.sum

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: 🔨 Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true