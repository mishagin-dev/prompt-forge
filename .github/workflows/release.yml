name: 🚀 Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  APP_NAME: promptforge
  GO_VERSION: '1.25.3'

jobs:
  build-release:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: windows
            arch: amd64
            goos: windows
            goarch: amd64
            binary_name: promptforge.exe
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            goos: linux
            goarch: amd64
            binary_name: promptforge
          - os: ubuntu-latest
            platform: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
            binary_name: promptforge
          - os: ubuntu-latest
            platform: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
            binary_name: promptforge-arm64

    steps:
      # === Repository Setup ===
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # === Go Setup ===
      - name: 🐹 Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api/go.sum

      # === Version Detection ===
      - name: 🏷️ Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Version: ${VERSION}"

      # === Build Configuration ===
      - name: 🔧 Set build variables
        id: build-vars
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "binary_name=${{ matrix.binary_name }}" >> $GITHUB_OUTPUT
          echo "package_name=${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      # === Dependencies ===
      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          cd api && go mod tidy
          echo "🔨 Copying frontend..."
          cp -r ../frontend .

      # === Build Binary ===
      - name: 🔨 Build binary for ${{ matrix.platform }}/${{ matrix.arch }}
        run: |
          echo "🔨 Building for ${{ matrix.platform }}/${{ matrix.arch }}..."
          cd api
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-X main.version=${{ steps.version.outputs.version }} -X main.buildTime=${{ steps.build-vars.outputs.build_time }}" \
            -o ../${{ steps.build-vars.outputs.binary_name }} main.go
          echo "✅ Binary created: ${{ steps.build-vars.outputs.binary_name }}"

      # === Create Package Directory ===
      - name: 📁 Create package directory
        run: |
          mkdir -p packages/${{ steps.build-vars.outputs.package_name }}
          cp ${{ steps.build-vars.outputs.binary_name }} packages/${{ steps.build-vars.outputs.package_name }}/
          cp .env.example packages/${{ steps.build-vars.outputs.package_name }}/.env
          echo "✅ Package directory created: packages/${{ steps.build-vars.outputs.package_name }}"

      # === Create Archive ===
      - name: 📦 Create distribution archive
        run: |
          cd packages
          tar -czf ${{ steps.build-vars.outputs.package_name }}.tar.gz ${{ steps.build-vars.outputs.package_name }}/
          echo "✅ Archive created: ${{ steps.build-vars.outputs.package_name }}.tar.gz"
          ls -la ${{ steps.build-vars.outputs.package_name }}.tar.gz

      # === Upload Artifact ===
      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-vars.outputs.package_name }}
          path: packages/${{ steps.build-vars.outputs.package_name }}.tar.gz
          retention-days: 30

  create-release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      # === Download All Artifacts ===
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # === Extract Artifacts ===
      - name: 📦 Extract artifacts
        run: |
          mkdir -p release-assets
          find ./artifacts -name "*.tar.gz" -exec cp {} ./release-assets/ \;
          echo "📦 Release assets prepared:"
          ls -la ./release-assets/

      # === Upload Release Assets ===
      - name: 🚀 Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release-assets/
          asset_name: release-assets
          asset_content_type: application/gzip

      # === Upload Individual Assets ===
      - name: 📤 Upload individual release assets
        run: |
          for asset in ./release-assets/*.tar.gz; do
            filename=$(basename "$asset")
            echo "📤 Uploading $filename..."
            gh release upload ${{ github.event.release.tag_name }} "$asset" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manual-release:
    name: 📦 Manual Release Build
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      # === Download All Artifacts ===
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # === Create Release ===
      - name: 🏷️ Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: |
            ## 🚀 PromptForge ${{ github.event.inputs.version }}
            
            ### 📦 Downloads
            This release includes pre-built binaries for:
            - Windows (amd64)
            - Linux (amd64) 
            - macOS (Intel amd64)
            - macOS (Apple Silicon arm64)
            
            Each package includes:
            - The PromptForge binary
            - .env configuration file (ready to use)
            
            ### 🔧 Installation
            1. Download the appropriate package for your platform
            2. Extract the archive
            3. Edit `.env` file and configure your API keys
            4. Run the binary
            
          draft: false
          prerelease: false

      # === Upload Release Assets ===
      - name: 📤 Upload release assets
        run: |
          for asset in ./artifacts/*/*.tar.gz; do
            filename=$(basename "$asset")
            echo "📤 Uploading $filename..."
            gh release upload ${{ github.event.inputs.version }} "$asset" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# === Global Configuration ===
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true