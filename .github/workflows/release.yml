name: 🚀 Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  APP_NAME: promptforge
  GO_VERSION: '1.25.3'

jobs:
  build-release:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            goos: windows
            goarch: amd64
            binary_name: promptforge.exe
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
            binary_name: promptforge
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
            binary_name: promptforge
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
            binary_name: promptforge-arm64

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐹 Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: api/go.sum

      - name: 🏷️ Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: 🔧 Set build variables
        id: build-vars
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "binary_name=${{ matrix.binary_name }}" >> $GITHUB_OUTPUT
          echo "package_name=${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: 📦 Install dependencies
        run: |
          cd api && go mod tidy
          cp -r ../frontend .

      - name: 🔨 Build binary
        run: |
          cd api
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-X main.version=${{ steps.version.outputs.version }} -X main.buildTime=${{ steps.build-vars.outputs.build_time }}" \
            -o ../${{ steps.build-vars.outputs.binary_name }} main.go

      - name: 📁 Create package
        run: |
          mkdir -p packages/${{ steps.build-vars.outputs.package_name }}
          cp ${{ steps.build-vars.outputs.binary_name }} packages/${{ steps.build-vars.outputs.package_name }}/
          cp .env.example packages/${{ steps.build-vars.outputs.package_name }}/.env

      - name: 📦 Create archive
        run: |
          cd packages
          tar -czf ${{ steps.build-vars.outputs.package_name }}.tar.gz ${{ steps.build-vars.outputs.package_name }}/

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-vars.outputs.package_name }}
          path: packages/${{ steps.build-vars.outputs.package_name }}.tar.gz
          retention-days: 30

  create-release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            ## 🚀 PromptForge ${{ github.event.inputs.version }}
            
            ### 📦 Downloads
            This release includes pre-built binaries for:
            - Windows (amd64)
            - Linux (amd64) 
            - macOS (Intel amd64)
            - macOS (Apple Silicon arm64)
            
            Each package includes:
            - The PromptForge binary
            - .env configuration file (ready to use)
            
            ### 🔧 Installation
            1. Download the appropriate package for your platform
            2. Extract the archive
            3. Edit `.env` file and configure your API keys
            4. Run the binary
          files: ./artifacts/**/*.tar.gz
          draft: false
          prerelease: false

  upload-release-assets:
    name: 📤 Upload Release Assets
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 📤 Upload to existing release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*.tar.gz

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true