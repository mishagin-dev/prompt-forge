name: 🧪 Run Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'
  CACHE_VERSION: v1
  GOCACHE: /tmp/go-cache
  GOMODCACHE: /tmp/go-mod-cache

jobs:
  # === Unit Tests ===
  test:
    name: 🔬 Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - go-version: '1.21'
            os: ubuntu-latest
            arch: amd64
          - go-version: '1.21'
            os: windows-latest
            arch: amd64
          - go-version: '1.21'
            os: macos-latest
            arch: amd64
          - go-version: '1.22'
            os: ubuntu-latest
            arch: amd64
          - go-version: '1.22'
            os: macos-latest
            arch: amd64
          - go-version: '1.23'
            os: ubuntu-latest
            arch: amd64
        exclude:
          - go-version: '1.23'
            os: windows-latest  # Исключаем проблемные комбинации

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: api/go.sum

      # === Установка переменных окружения для Go ===
      - name: 🔧 Set up Go environment
        run: |
          echo "GOROOT=$(go env GOROOT)" >> $GITHUB_ENV
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "GOCACHE=/tmp/go-cache" >> $GITHUB_ENV
          echo "GOMODCACHE=/tmp/go-mod-cache" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "GOOS=${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'darwin' || 'windows' }}" >> $GITHUB_ENV
          echo "GOARCH=amd64" >> $GITHUB_ENV

      # === Создание необходимых директорий ===
      - name: 📁 Create required directories
        run: |
          mkdir -p /tmp/go-cache
          mkdir -p /tmp/go-mod-cache
          mkdir -p /tmp/coverage
          chmod 755 /tmp/go-cache
          chmod 755 /tmp/go-mod-cache
          chmod 755 /tmp/coverage

      - name: 📦 Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
            /tmp/go-cache
            /tmp/go-mod-cache
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('api/go.sum', 'api/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      # === Переход в директорию api и настройка модуля ===
      - name: 🔧 Setup Go module
        working-directory: ./api
        run: |
          echo "📁 Current directory: $(pwd)"
          echo "🐹 Go version: $(go version)"
          echo "📦 Go module info:"
          go list -m
          echo "🔍 Go environment:"
          go env
          echo "📋 Go mod verify:"
          go mod verify
          echo "📥 Go mod download:"
          go mod download
          echo "🧹 Go mod tidy:"
          go mod tidy

      - name: 📁 Copy frontend files
        run: cp -r frontend api/

      - name: 🏗️ Build application
        working-directory: ./api
        run: |
          echo "🏗️ Building application..."
          go build -v -o promptforge .
          echo "✅ Build completed"

      - name: 🧪 Run tests
        working-directory: ./api
        run: |
          echo "🔍 Running tests with module: $(go list -m)"
          echo "📁 Working directory: $(pwd)"
          echo "📂 Directory listing:"
          ls -la
          echo ""
          echo "🧪 Starting test execution..."
          
          # Запуск тестов с правильными переменными окружения
          GOCACHE=/tmp/go-cache \
          GOMODCACHE=/tmp/go-mod-cache \
          CGO_ENABLED=1 \
          go test -v -race -coverprofile=/tmp/coverage/coverage-${{ matrix.go-version }}-${{ matrix.os }}.out ./...
          
          echo "✅ Tests completed successfully"

      - name: 📊 Generate coverage report
        working-directory: ./api
        run: |
          echo "📊 Generating coverage report..."
          go tool cover -func=/tmp/coverage/coverage-${{ matrix.go-version }}-${{ matrix.os }}.out
          go tool cover -html=/tmp/coverage/coverage-${{ matrix.go-version }}-${{ matrix.os }}.out -o /tmp/coverage/coverage-${{ matrix.go-version }}-${{ matrix.os }}.html
          echo "✅ Coverage report generated"

      - name: 🔍 Lint code
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: api
          args: --timeout=5m

      - name: 📈 Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.go-version }}-${{ matrix.os }}
          path: |
            /tmp/coverage/coverage-${{ matrix.go-version }}-${{ matrix.os }}.out
            /tmp/coverage/coverage-${{ matrix.go-version }}-${{ matrix.os }}.html
          retention-days: 30

  # === Integration Tests ===
  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.platform }}-
            ${{ runner.os }}-buildx-

      - name: 🐳 Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: promptforge:test-${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: 🚀 Run container
        run: |
          docker run -d --name promptforge-test-${{ matrix.platform }} -p 8080:8080 promptforge:test-${{ matrix.platform }}
          sleep 15

      - name: 🔍 Health check
        run: |
          timeout=60
          interval=2
          elapsed=0
          
          while [ $elapsed -lt $timeout ]; do
            if curl -s -f http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "✅ Service is ready after ${elapsed}s"
              break
            fi
            sleep $interval
            elapsed=$((elapsed + interval))
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "❌ Service failed to start within ${timeout}s"
            docker logs promptforge-test-${{ matrix.platform }}
            exit 1
          fi

      - name: 🧪 Run integration tests
        run: |
          # Test health endpoint
          curl -f http://localhost:8080/api/health
          echo "✅ Health check passed"
          
          # Test providers endpoint
          curl -f http://localhost:8080/api/providers
          echo "✅ Providers endpoint working"
          
          # Test frontend is served
          curl -f http://localhost:8080/ | grep -q "PromptForge"
          echo "✅ Frontend is being served"

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker stop promptforge-test-${{ matrix.platform }} || true
          docker rm promptforge-test-${{ matrix.platform }} || true

  # === Security Scan ===
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🔍 Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, GPL-3.0
          deny-licenses: GPL-2.0, AGPL-3.0
          comment-summary-in-pr: always

      - name: 🔍 Scan Go dependencies for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd api
          ~/go/bin/govulncheck ./...

      - name: 🔍 Scan OS dependencies
        run: |
          go install github.com/aquasecurity/trivy@latest
          ~/go/bin/trivy fs --security-checks vuln --format sarif --output trivy-fs.sarif .

      - name: 🛡️ Run Gosec Security Scanner
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@v2.19.0
          cd api
          ~/go/bin/gosec -fmt sarif -out ../gosec.sarif -no-fail ./...

      - name: 📤 Upload SARIF files
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            gosec.sarif
            trivy-fs.sarif

# === Global Configuration ===
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true