services:
  promptforge:
    image: ghcr.io/insaanimanav/prompt-forge:main
    container_name: promptforge
    ports:
      - "8080:8080"
    environment:
      # Anthropic API (Default)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}

      # OpenAI API (Optional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}

      # Azure OpenAI API (Optional)
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_BASE_URL=${AZURE_OPENAI_BASE_URL:-https://it-li-m9l4hi9c-eastus2.cognitiveservices.azure.com/}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}

      # Configuration
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-anthropic}
      - PORT=8080
      - DATABASE_PATH=${DATABASE_PATH:-/data/promptforge.db}
    volumes:
      # Persist database across container restarts
      - promptforge_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  promptforge_data:
    driver: local 